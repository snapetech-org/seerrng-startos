# ng-runner-policy: private-jit-only-v1
# Adapted from Start9Labs/start-technologies at c5cc5f89eed22b67f522c03ae3ebec029dea9669.
# Runner selection is maintained locally to enforce private JIT only.
name: Tag and Release

on:
  workflow_call:
    inputs:
      TAG:
        description: Existing v* tag on the default branch to build and publish
        type: string
        required: true
      REFERENCE_REGISTRY:
        description: 'Registry where published versions are permanent (used to check if a version is already taken)'
        type: string
        required: true
      FREE_DISK_SPACE:
        description: 'Free up disk space before building'
        type: boolean
        default: false
      RELEASE_REGISTRY:
        description: 'Test registry to publish to'
        type: string
      S3_S9PKS_BASE_URL:
        description: 'S3 base URL for package uploads'
        type: string
    secrets:
      DEV_KEY:
        description: 'Developer signing key'
        required: true
      S3_ACCESS_KEY:
        description: 'S3 access key for uploading packages'
        required: false
      S3_SECRET_KEY:
        description: 'S3 secret key for uploading packages'
        required: false

jobs:
  Tag:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-seerrng-startos","ng-main-run-{0}","gha-{0}-tag"]}}', github.run_id)) }}
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout selected release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.TAG }}
          fetch-depth: 0

      - name: Verify selected tag is on the default branch
        env:
          RELEASE_TAG: ${{ inputs.TAG }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main
        shell: bash

      - name: Install start-cli
        uses: Start9Labs/start-technologies/.github/actions/install-start-cli@c5cc5f89eed22b67f522c03ae3ebec029dea9669

      - name: Extract package ID and version
        id: extract
        uses: Start9Labs/start-technologies/.github/actions/extract-version@c5cc5f89eed22b67f522c03ae3ebec029dea9669

      - name: Verify selected tag matches the package version
        env:
          SELECTED_TAG: ${{ inputs.TAG }}
          PACKAGE_TAG: ${{ steps.extract.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_TAG" == "$PACKAGE_TAG" ]] || {
            echo "::error::Selected release tag does not match the package version at that tag"
            exit 1
          }
        shell: bash

      - name: Check production registry
        id: check
        run: |
          PACKAGE_ID="${{ steps.extract.outputs.package_id }}"
          VERSION="${{ steps.extract.outputs.version }}"
          REFERENCE_REGISTRY="${{ inputs.REFERENCE_REGISTRY }}"

          # hello-world is the canonical package scaffold, not a released package.
          # Skipping it here lets every caller (including hello-world's own) use the
          # identical thin workflow with no per-package guard job.
          if [ "$PACKAGE_ID" = "hello-world" ]; then
            echo "Package id is 'hello-world' (template scaffold); skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking if ${PACKAGE_ID}@${VERSION} exists on ${REFERENCE_REGISTRY}..."

          OUTPUT=$(start-cli --registry="${REFERENCE_REGISTRY}" registry package get "${PACKAGE_ID}" --target-version="${VERSION}" 2>&1)
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Failed to query production registry: ${OUTPUT}"
            exit 1
          fi

          if [ -n "$OUTPUT" ]; then
            echo "Version ${VERSION} of ${PACKAGE_ID} already exists on ${REFERENCE_REGISTRY}. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} not found on production registry. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash


  Release:
    needs: Tag
    if: needs.Tag.outputs.skip == 'false'
    uses: ./.github/workflows/private-startos-release.yml
    with:
      TAG: ${{ needs.Tag.outputs.tag }}
      FREE_DISK_SPACE: ${{ inputs.FREE_DISK_SPACE }}
      RELEASE_REGISTRY: ${{ inputs.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ inputs.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}

