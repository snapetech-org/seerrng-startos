# ng-runner-policy: private-jit-only-v1
name: Build
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) || format('action:build:pool:private') }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Required private JIT action tag
        required: true
        type: choice
        options: [build]
      runner_pool_tag:
        description: Required private JIT runner pool tag
        required: true
        type: choice
        options: [private]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action_tag == 'build' && inputs.runner_pool_tag == 'private'
    uses: ./.github/workflows/private-startos-build.yml
    # This build-only dispatch does not publish, so no signing key is required.
