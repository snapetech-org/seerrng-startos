# ng-runner-policy: private-jit-only-v1
name: Tag and Release

on:
  workflow_call:
    inputs:
      TAG:
        description: Existing v* release tag on the default branch
        type: string
        required: true
      REFERENCE_REGISTRY:
        description: Registry where published versions are permanent
        type: string
        required: true
      FREE_DISK_SPACE:
        description: Free up disk space before building
        type: boolean
        default: false
      RELEASE_REGISTRY:
        description: Registry where the release is published
        type: string
      S3_S9PKS_BASE_URL:
        description: S3 base URL for package uploads
        type: string
    secrets:
      DEV_KEY:
        description: Developer signing key
        required: true
      S3_ACCESS_KEY:
        description: S3 access key for uploading packages
        required: false
      S3_SECRET_KEY:
        description: S3 secret key for uploading packages
        required: false

jobs:
  tag:
    uses: ./.github/workflows/private-startos-tagAndRelease.yml
    with:
      TAG: ${{ inputs.TAG }}
      REFERENCE_REGISTRY: ${{ inputs.REFERENCE_REGISTRY }}
      FREE_DISK_SPACE: ${{ inputs.FREE_DISK_SPACE }}
      RELEASE_REGISTRY: ${{ inputs.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ inputs.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
