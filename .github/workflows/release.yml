name: Release

run-name: ${{ format('action:release:pool:private:tag:{0}', inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Publish the selected existing release tag
        type: choice
        options: [release]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true
      release_tag:
        description: Existing v* tag on the default branch
        type: string
        required: true
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'release' && inputs.runner_pool == 'private' && inputs.release_tag != ''
    uses: ./.github/workflows/private-startos-release.yml
    with:
      TAG: ${{ inputs.release_tag }}
      RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ vars.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
