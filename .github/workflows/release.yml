# ng-runner-policy: private-jit-only-v1
name: Release
run-name: >-
  ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action_tag, inputs.runner_pool_tag, inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Required private JIT release action tag
        type: choice
        options: [release]
        required: true
      runner_pool_tag:
        description: Required private JIT runner pool tag
        type: choice
        options: [private]
        required: true
      release_tag:
        description: Existing v* tag on the default branch to build and publish
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action_tag == 'release' &&
      inputs.runner_pool_tag == 'private' &&
      inputs.release_tag != ''
    uses: ./.github/workflows/tagAndRelease.yml
    with:
      TAG: ${{ inputs.release_tag }}
      REFERENCE_REGISTRY: ${{ vars.REFERENCE_REGISTRY }}
      RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      S3_S9PKS_BASE_URL: ${{ vars.S3_S9PKS_BASE_URL }}
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    permissions:
      contents: write
