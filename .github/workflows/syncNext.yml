name: Sync next
run-name: ${{ github.event_name == 'workflow_dispatch' && format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) || format('action:sync:pool:private') }}

# Carries every change that lands on the base branch onto the paired `next`
# iteration branch, so `next` never drifts behind what has already shipped.
# `next` is created on the first run if the repo does not have one yet.
on:
  push:
    branches: ['master']
  workflow_dispatch:
    inputs:
      action:
        description: Select the private JIT action
        required: true
        type: choice
        options: [sync]
      runner_pool:
        description: Required private JIT runner pool
        required: true
        type: choice
        options: [private]

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' &&
       inputs.action == 'sync' && inputs.runner_pool == 'private')
    uses: ./.github/workflows/private-startos-syncNext.yml
    permissions:
      contents: write
      pull-requests: write
