# ng-runner-policy: private-jit-only-v1
name: Sync next
run-name: >-
  ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

# Manually carry the base branch onto the paired `next` iteration branch when
# an explicit synchronization is needed.
on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Required private JIT action tag
        required: true
        type: choice
        options: [sync]
      runner_pool_tag:
        description: Required private JIT runner pool tag
        required: true
        type: choice
        options: [private]

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action_tag == 'sync' && inputs.runner_pool_tag == 'private'
    uses: ./.github/workflows/private-startos-syncNext.yml
    permissions:
      contents: write
      pull-requests: write
